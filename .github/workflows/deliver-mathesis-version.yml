name: Publish Version to Zenodo and Mathesis

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Monotonic integer Mathesis version (e.g. 1, 2, 3)"
        required: true
        default: "1"
        type: string
      version_label:
        description: "Human-readable release label (e.g. v1.0, v1.1)"
        required: true
        default: "v1.0"
        type: string
      previous_zenodo_record_id:
        description: "Previous Zenodo numeric record ID for v2+ (leave empty for v1.0)"
        required: false
        default: ""
        type: string
      existing_zenodo_doi:
        description: "Optional already-published exact Zenodo DOI (10.5281/zenodo.<id>) for recovery"
        required: false
        default: ""
        type: string
      changelog:
        description: "Optional changelog override (defaults to matching CHANGELOG.md section)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validate bundle, SHA-256 hashes, and metadata without publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-zenodo-mathesis-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publisher unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Package, publish to Zenodo, and deliver to Mathesis
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_LABEL: ${{ inputs.version_label }}
          INPUT_PREV_ZENODO_ID: ${{ inputs.previous_zenodo_record_id }}
          INPUT_EXISTING_DOI: ${{ inputs.existing_zenodo_doi }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          MATHESIS_URL: ${{ vars.MATHESIS_URL || secrets.MATHESIS_URL || 'https://mathesis-omega-research.apps.chrono-ai.fun' }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          MATHESIS_TOKEN: ${{ secrets.MATHESIS_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            .
            --out-dir "$RUNNER_TEMP/publish-out"
            --version "$INPUT_VERSION"
            --version-label "$INPUT_VERSION_LABEL"
            --auto-previous-version
          )
          if [[ -n "$INPUT_PREV_ZENODO_ID" ]]; then
            args+=(--previous-zenodo-record-id "$INPUT_PREV_ZENODO_ID")
          fi
          if [[ -n "$INPUT_EXISTING_DOI" ]]; then
            args+=(--existing-zenodo-doi "$INPUT_EXISTING_DOI")
          fi
          if [[ -n "$INPUT_CHANGELOG" ]]; then
            args+=(--changelog "$INPUT_CHANGELOG")
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/publish_version.py "${args[@]}"

      - name: Upload publication bundle and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-bundle-v${{ inputs.version }}
          path: |
            ${{ runner.temp }}/publish-out/paper.pdf
            ${{ runner.temp }}/publish-out/source-v${{ inputs.version }}.zip
            ${{ runner.temp }}/publish-out/zenodo-metadata-v${{ inputs.version }}.json
            ${{ runner.temp }}/publish-out/publication-receipt-v${{ inputs.version }}.json
          if-no-files-found: ignore
          retention-days: 90
